name: libredesk

services:
  app:
    image: ${LIBREDESK_IMAGE:-libredesk/libredesk:v2.8.0@sha256:1e5e9f766a8f240cb34cc1e923ebc7f3106971c3408e5c334039ad38658bce78}
    container_name: libredesk_app
    restart: unless-stopped
    init: true
    environment:
      LIBREDESK_APP__LOG_LEVEL: info
      LIBREDESK_APP__ENV: prod
      LIBREDESK_APP__CHECK_UPDATES: "true"
      LIBREDESK_APP__ENCRYPTION_KEY: ${LIBREDESK_ENCRYPTION_KEY:?set in .env}
      LIBREDESK_APP__SERVER__ADDRESS: 0.0.0.0:9000
      LIBREDESK_APP__SERVER__DISABLE_SECURE_COOKIES: "false"
      LIBREDESK_UPLOAD__PROVIDER: fs
      LIBREDESK_UPLOAD__FS__UPLOAD_PATH: /libredesk/uploads
      LIBREDESK_DB__HOST: db
      LIBREDESK_DB__PORT: "5432"
      LIBREDESK_DB__USER: ${POSTGRES_USER:-libredesk}
      LIBREDESK_DB__PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      LIBREDESK_DB__DATABASE: ${POSTGRES_DB:-libredesk}
      LIBREDESK_DB__SSL_MODE: disable
      LIBREDESK_REDIS__ADDRESS: redis:6379
      LIBREDESK_REDIS__PASSWORD: ${REDIS_PASSWORD:?set in .env}
    command:
      - sh
      - -c
      - >-
        ./libredesk --install --idempotent-install --yes --config=/libredesk/config.toml &&
        ./libredesk --upgrade --yes --config=/libredesk/config.toml &&
        exec ./libredesk --config=/libredesk/config.toml
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
      - egress
    volumes:
      - ./data/uploads:/libredesk/uploads:rw
      - ./config.toml:/libredesk/config.toml:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 30s
    logging: &default-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  proxy:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    container_name: libredesk_proxy
    restart: unless-stopped
    init: true
    user: "101:101"
    ports:
      - "127.0.0.1:${LIBREDESK_PORT:-9000}:8080"
      - "${LIBREDESK_TAILSCALE_IP:-100.105.41.61}:${LIBREDESK_PORT:-9000}:8080"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - egress
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/html/oledu-assets:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=0750,uid=101,gid=101
      - /var/run:size=1m,mode=0750,uid=101,gid=101
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.25
    stop_grace_period: 15s
    logging: *default-logging

  ollama-init:
    image: &ollama-image ${OLLAMA_IMAGE:-ollama/ollama:0.32.15@sha256:ab903927dcb081c6d3780b54a7b6de4fda6a65cb9799e4f047a34ba9511b9c78}
    restart: "no"
    entrypoint:
      - /bin/sh
      - /usr/local/bin/init-ollama.sh
    environment:
      HOME: /tmp
      OLLAMA_MODELS: /models
      OLLAMA_COMPLETION_MODEL: ${OLLAMA_COMPLETION_MODEL:-qwen3:1.7b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
    networks:
      - backend
      - egress
    volumes:
      - ollama-models:/models
      - ./init-ollama.sh:/usr/local/bin/init-ollama.sh:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${OLLAMA_INIT_MEMORY_LIMIT:-1g}
    cpus: ${OLLAMA_INIT_CPU_LIMIT:-1.0}
    logging: *default-logging

  ollama:
    image: *ollama-image
    container_name: libredesk_ollama
    restart: unless-stopped
    init: true
    user: "1000:0"
    environment:
      HOME: /tmp
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: "true"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: ${OLLAMA_COMPLETION_KEEP_ALIVE:-30m}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-32}
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=127.0.0.1:11434 ollama list >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - backend
    volumes:
      - ollama-models:/models
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${OLLAMA_COMPLETION_MEMORY_LIMIT:-3g}
    cpus: ${OLLAMA_COMPLETION_CPU_LIMIT:-4.0}
    stop_grace_period: 30s
    logging: *default-logging

  # Embedding is deliberately isolated from customer-facing completion. A full help-centre
  # reindex can keep this one-CPU service busy without occupying the completion model's queue.
  ollama-embedding:
    image: *ollama-image
    container_name: libredesk_ollama_embedding
    restart: unless-stopped
    init: true
    user: "1000:0"
    environment:
      HOME: /tmp
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: "true"
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: ${OLLAMA_EMBEDDING_KEEP_ALIVE:-5m}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_EMBEDDING_CONTEXT_LENGTH:-4096}
      OLLAMA_MAX_QUEUE: ${OLLAMA_EMBEDDING_MAX_QUEUE:-32}
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=127.0.0.1:11434 ollama list >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - backend
    volumes:
      - ollama-models:/models
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${OLLAMA_EMBEDDING_MEMORY_LIMIT:-2600m}
    cpus: ${OLLAMA_EMBEDDING_CPU_LIMIT:-1.0}
    stop_grace_period: 30s
    logging: *default-logging

  db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    container_name: libredesk_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-libredesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-libredesk}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - backend
    volumes:
      - postgres-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 1.5
    stop_grace_period: 60s
    logging: *default-logging

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: libredesk_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - backend
    volumes:
      - redis-data:/data
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5
    stop_grace_period: 30s
    logging: *default-logging

networks:
  backend:
    internal: true
  egress:

volumes:
  postgres-data:
  redis-data:
  ollama-models:
